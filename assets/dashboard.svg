<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D14" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="1000" height="520" rx="12" fill="url(#bg)" stroke="#334155" stroke-width="2" />
  <rect width="1000" height="40" rx="12" fill="#0F172A" />
  <circle cx="24" cy="20" r="6" fill="#EF4444" />
  <circle cx="44" cy="20" r="6" fill="#F59E0B" />
  <circle cx="64" cy="20" r="6" fill="#10B981" />
  <text x="100" y="24" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">http://localhost:3000 — AERA-ML Search &amp; Recommendation Intelligence Hub</text>

  <!-- Sidebar -->
  <g transform="translate(20, 60)">
    <rect width="210" height="440" rx="8" fill="url(#card)" stroke="#1E293B" />
    <text x="18" y="32" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#38BDF8">AERA-ML Platform</text>

    <!-- Nav Items -->
    <rect x="10" y="50" width="190" height="32" rx="6" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.4" />
    <text x="24" y="71" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">🔍 Search Retrieval</text>

    <text x="24" y="115" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">⚡ Learning To Rank</text>
    <text x="24" y="150" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">🎯 Recommendation Hub</text>
    <text x="24" y="185" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">📊 Explainable AI (SHAP)</text>
    <text x="24" y="220" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">📈 MLflow &amp; Registry</text>
    <text x="24" y="255" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">🗄️ MSLR Feature Store</text>

    <!-- System Status -->
    <rect x="10" y="360" width="190" height="65" rx="6" fill="#0A0D14" stroke="#334155" />
    <text x="20" y="380" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#34D399">● FASTAPI ONLINE (8000)</text>
    <text x="20" y="398" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">● REDIS CACHE ACTIVE</text>
    <text x="20" y="414" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">● MSLR-WEB10K READY</text>
  </g>

  <!-- Main View Area -->
  <g transform="translate(250, 60)">
    <!-- Search Bar Box -->
    <rect width="730" height="65" rx="8" fill="url(#card)" stroke="#334155" />
    <text x="20" y="25" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">SEARCH QUERY</text>
    <rect x="20" y="32" width="460" height="24" rx="4" fill="#0A0D14" stroke="#06B6D4" />
    <text x="30" y="48" font-family="Inter, sans-serif" font-size="12" fill="#F8FAFC">headphones wireless noise cancelling</text>

    <rect x="490" y="32" width="100" height="24" rx="4" fill="#06B6D4" />
    <text x="540" y="48" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0A0D14" text-anchor="middle">SEARCH</text>

    <!-- Algorithm Pills -->
    <rect x="600" y="32" width="110" height="24" rx="4" fill="#1E293B" stroke="#10B981" />
    <text x="655" y="48" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">LambdaMART ★</text>

    <!-- Results Table -->
    <rect x="0" y="80" width="730" height="420" rx="8" fill="url(#card)" stroke="#334155" />
    <text x="20" y="105" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Ranked Candidates (Top 10 of 100 retrieved)</text>
    <text x="500" y="105" font-family="Inter, monospace" font-size="11" fill="#34D399">Execution Time: 1.84 ms</text>

    <!-- Table Header -->
    <rect x="15" y="120" width="700" height="30" fill="#0A0D14" rx="4" />
    <text x="25" y="140" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">RANK</text>
    <text x="80" y="140" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">PRODUCT NAME</text>
    <text x="380" y="140" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">BM25</text>
    <text x="460" y="140" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">CTR</text>
    <text x="530" y="140" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">LAMBDAMART</text>
    <text x="650" y="140" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">SHAP</text>

    <!-- Row 1 -->
    <rect x="15" y="158" width="700" height="38" fill="#1E293B" rx="4" stroke="#06B6D4" stroke-opacity="0.3" />
    <text x="35" y="181" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#38BDF8">#1</text>
    <text x="80" y="181" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Sony WH-1000XM5 Noise Cancelling</text>
    <text x="380" y="181" font-family="Inter, monospace" font-size="11" fill="#E2E8F0">3.82</text>
    <text x="460" y="181" font-family="Inter, monospace" font-size="11" fill="#E2E8F0">15.0%</text>
    <text x="530" y="181" font-family="Inter, monospace" font-size="12" font-weight="700" fill="#34D399">0.892</text>
    <rect x="640" y="168" width="60" height="18" rx="3" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" />
    <text x="670" y="181" font-family="Inter, sans-serif" font-size="9" fill="#A78BFA" text-anchor="middle">Explain</text>

    <!-- Row 2 -->
    <rect x="15" y="202" width="700" height="38" fill="#0A0D14" rx="4" />
    <text x="35" y="225" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#94A3B8">#2</text>
    <text x="80" y="225" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Apple AirPods Pro (2nd Gen) USB-C</text>
    <text x="380" y="225" font-family="Inter, monospace" font-size="11" fill="#E2E8F0">3.45</text>
    <text x="460" y="225" font-family="Inter, monospace" font-size="11" fill="#E2E8F0">22.0%</text>
    <text x="530" y="225" font-family="Inter, monospace" font-size="12" font-weight="700" fill="#34D399">0.854</text>
    <rect x="640" y="212" width="60" height="18" rx="3" fill="#334155" />
    <text x="670" y="225" font-family="Inter, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Explain</text>

    <!-- Row 3 -->
    <rect x="15" y="246" width="700" height="38" fill="#1E293B" rx="4" />
    <text x="35" y="269" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#94A3B8">#3</text>
    <text x="80" y="269" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Bose QuietComfort Ultra Headphones</text>
    <text x="380" y="269" font-family="Inter, monospace" font-size="11" fill="#E2E8F0">3.12</text>
    <text x="460" y="269" font-family="Inter, monospace" font-size="11" fill="#E2E8F0">11.5%</text>
    <text x="530" y="269" font-family="Inter, monospace" font-size="12" font-weight="700" fill="#34D399">0.781</text>
    <rect x="640" y="256" width="60" height="18" rx="3" fill="#334155" />
    <text x="670" y="269" font-family="Inter, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Explain</text>

    <!-- Row 4 -->
    <rect x="15" y="290" width="700" height="38" fill="#0A0D14" rx="4" />
    <text x="35" y="313" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#94A3B8">#4</text>
    <text x="80" y="313" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Sennheiser Momentum 4 Wireless</text>
    <text x="380" y="313" font-family="Inter, monospace" font-size="11" fill="#E2E8F0">2.98</text>
    <text x="460" y="313" font-family="Inter, monospace" font-size="11" fill="#E2E8F0">9.2%</text>
    <text x="530" y="313" font-family="Inter, monospace" font-size="12" font-weight="700" fill="#34D399">0.710</text>
    <rect x="640" y="300" width="60" height="18" rx="3" fill="#334155" />
    <text x="670" y="313" font-family="Inter, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Explain</text>
  </g>
</svg>