<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D14" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>
    <linearGradient id="positive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="negative" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg)" stroke="#1E293B" stroke-width="2" />

  <!-- Header -->
  <text x="40" y="40" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">TreeSHAP Feature Importance &amp; Score Attribution Waterfall</text>
  <text x="40" y="60" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Explaining document rank score for query: "laptop 16GB RAM" (Base E[f(x)] = 0.25 → Output f(x) = 0.88)</text>

  <!-- Axes Grid -->
  <line x1="280" y1="80" x2="280" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="480" y1="80" x2="480" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="680" y1="80" x2="680" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />

  <text x="280" y="380" font-family="Inter, monospace" font-size="10" fill="#94A3B8" text-anchor="middle">0.25 (Base)</text>
  <text x="480" y="380" font-family="Inter, monospace" font-size="10" fill="#94A3B8" text-anchor="middle">0.55</text>
  <text x="680" y="380" font-family="Inter, monospace" font-size="10" fill="#34D399" text-anchor="middle">0.88 (Output Score)</text>

  <!-- Waterfall Bars -->
  <!-- Row 1: BM25 Title Match -->
  <text x="40" y="115" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">1. BM25 Title Match (bm25_title)</text>
  <rect x="280" y="100" width="240" height="24" rx="4" fill="url(#positive)" />
  <text x="530" y="116" font-family="Inter, monospace" font-size="11" font-weight="700" fill="#34D399">+0.36</text>

  <!-- Row 2: Historic CTR -->
  <text x="40" y="165" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">2. Historic Click Ratio (ctr_7d)</text>
  <rect x="520" y="150" width="110" height="24" rx="4" fill="url(#positive)" />
  <text x="640" y="166" font-family="Inter, monospace" font-size="11" font-weight="700" fill="#34D399">+0.16</text>

  <!-- Row 3: LMIR.ABS Body -->
  <text x="40" y="215" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">3. Language Model (LMIR_ABS)</text>
  <rect x="630" y="200" width="80" height="24" rx="4" fill="url(#positive)" />
  <text x="720" y="216" font-family="Inter, monospace" font-size="11" font-weight="700" fill="#34D399">+0.12</text>

  <!-- Row 4: Document Length Penalty -->
  <text x="40" y="265" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">4. Document Length (doc_len)</text>
  <rect x="670" y="250" width="40" height="24" rx="4" fill="url(#negative)" />
  <text x="620" y="266" font-family="Inter, monospace" font-size="11" font-weight="700" fill="#FB7185">-0.06</text>

  <!-- Row 5: PageRank & Popularity -->
  <text x="40" y="315" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">5. PageRank &amp; Popularity</text>
  <rect x="670" y="300" width="35" height="24" rx="4" fill="url(#positive)" />
  <text x="715" y="316" font-family="Inter, monospace" font-size="11" font-weight="700" fill="#34D399">+0.05</text>

  <!-- Summary Box -->
  <rect x="40" y="345" font-family="Inter" width="210" height="50" rx="6" fill="#1E293B" stroke="#334155" />
  <text x="52" y="365" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Model Confidence</text>
  <text x="52" y="383" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#34D399">High (Top Rank Slot #1)</text>
</svg>