<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D14" />
      <stop offset="50%" stop-color="#121826" />
      <stop offset="100%" stop-color="#0A0D14" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)" />
  <rect width="1200" height="420" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Background Grid Pattern -->
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
  <path d="M150 0 V420 M300 0 V420 M450 0 V420 M600 0 V420 M750 0 V420 M900 0 V420 M1050 0 V420" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />

  <!-- Accent Top Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)" />

  <!-- Title & Subtitle -->
  <g transform="translate(60, 75)">
    <!-- Badge -->
    <rect width="270" height="28" rx="14" fill="#06B6D4" fill-opacity="0.1" stroke="#06B6D4" stroke-opacity="0.3" />
    <circle cx="16" cy="14" r="4" fill="#06B6D4" />
    <text x="28" y="18" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1">MICROSOFT MSLR-WEB10K LTR SUITE</text>

    <!-- Main Heading -->
    <text x="0" y="75" font-family="Inter, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#F8FAFC">AI Search &amp; Ranking Platform</text>

    <!-- Subtitle -->
    <text x="0" y="108" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">Production-Oriented Learning-to-Rank Engine • Sub-2ms Redis Feature Store • SHAP Observability</text>
  </g>

  <!-- Key Architecture Feature Cards -->
  <g transform="translate(60, 230)">
    <!-- Card 1: Retrieval -->
    <rect x="0" y="0" width="340" height="130" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="340" height="130" rx="12" fill="none" stroke="#06B6D4" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="32" cy="35" r="16" fill="#06B6D4" fill-opacity="0.15" />
    <text x="32" y="40" font-family="Inter, sans-serif" font-size="14" fill="#38BDF8" text-anchor="middle">🔍</text>
    <text x="60" y="38" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#F1F5F9">Candidate Retrieval</text>
    <text x="20" y="75" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Decoupled BM25 inverted index narrows candidate pool from 600,000 to Top-100 items.</text>
    <text x="20" y="102" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">LATENCY &lt; 1.0 ms</text>

    <!-- Card 2: LTR Ensemble -->
    <rect x="370" y="0" width="340" height="130" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1" />
    <rect x="370" y="0" width="340" height="130" rx="12" fill="none" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="402" cy="35" r="16" fill="#3B82F6" fill-opacity="0.15" />
    <text x="402" y="40" font-family="Inter, sans-serif" font-size="14" fill="#60A5FA" text-anchor="middle">⚡</text>
    <text x="430" y="38" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#F1F5F9">LambdaMART Ranking</text>
    <text x="390" y="75" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Listwise LightGBM tree ranker directly optimizing NDCG@10 using Lambda gradients.</text>
    <text x="390" y="102" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#60A5FA">NDCG@10 = 0.4512 • MRR = 0.8302</text>

    <!-- Card 3: MLOps & Drift -->
    <rect x="740" y="0" width="340" height="130" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1" />
    <rect x="740" y="0" width="340" height="130" rx="12" fill="none" stroke="#10B981" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="772" cy="35" r="16" fill="#10B981" fill-opacity="0.15" />
    <text x="772" y="40" font-family="Inter, sans-serif" font-size="14" fill="#34D399" text-anchor="middle">🛡️</text>
    <text x="800" y="38" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#F1F5F9">Explainability &amp; Drift</text>
    <text x="760" y="75" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">TreeSHAP score attributions, PSI drift detection, Thompson Sampling A/B testing.</text>
    <text x="760" y="102" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#34D399">MLFLOW + PROMETHEUS READY</text>
  </g>
</svg>