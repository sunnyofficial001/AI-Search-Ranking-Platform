<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b3b6f"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0%" stop-color="#1f7a8c"/>
      <stop offset="100%" stop-color="#3fb0ac"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g1)"/>

  <!-- Left abstract shapes -->
  <g transform="translate(60,40)">
    <rect x="0" y="0" width="440" height="280" rx="18" fill="url(#g2)" filter="url(#shadow)"/>
    <circle cx="360" cy="48" r="36" fill="#fff" opacity="0.12"/>
    <circle cx="320" cy="220" r="22" fill="#fff" opacity="0.08"/>
    <path d="M80 220 L120 160 L240 200 L320 100" stroke="#fff" stroke-width="3" stroke-opacity="0.12" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <g transform="translate(540,80)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="42" fill="#fff" font-weight="700">AI Search &amp; Ranking Platform</text>
    <text x="0" y="42" font-family="Inter, Arial, sans-serif" font-size="18" fill="#cfeffd">Production-ready retrieval, ranking, and MLOps pipeline</text>

    <g transform="translate(0,84)">
      <rect x="0" y="0" width="620" height="2" fill="#2ec4b6" opacity="0.9"/>
    </g>

    <g transform="translate(0,110)" font-family="Inter, Arial, sans-serif" font-size="14" fill="#e6f8fb">
      <text x="0" y="0">Tech:</text>
      <text x="60" y="0" fill="#9be7e0">React • Vite</text>
      <text x="220" y="0" fill="#9be7e0">FastAPI • Python</text>
      <text x="420" y="0" fill="#9be7e0">Postgres • Elasticsearch</text>
    </g>

    <g transform="translate(0,150)" font-family="Inter, Arial, sans-serif" font-size="13" fill="#dff8f7">
      <text x="0" y="0">Highlights:</text>
      <text x="75" y="0" fill="#d1f3f0">Synthetic demo, CI tests, Docker compose, MLOps with MLflow</text>
    </g>
  </g>

  <!-- Right badge cluster -->
  <g transform="translate(540,220)">
    <rect x="0" y="0" width="280" height="90" rx="8" fill="#07263b" stroke="#1f7a8c"/>
    <text x="18" y="26" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9be7e0">NDCG@10 (LambdaMART):</text>
    <text x="18" y="52" font-family="Inter, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700">0.451</text>
    <text x="150" y="28" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9be7e0">MRR (LambdaMART):</text>
    <text x="150" y="54" font-family="Inter, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700">0.830</text>
  </g>

  <!-- Footer note -->
  <g transform="translate(60,330)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9bb6c7">Built with reproducibility and MLOps best practices — demo-ready for recruiters.</text>
  </g>
</svg>