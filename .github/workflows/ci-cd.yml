name: Search Ranking Platform Production CI/CD Gate

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Pipeline Linters & Frontend Static Code Auditing
  frontend_ci:
    name: Frontend Audits & React Suite Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-size: 18
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Build Tests
        run: npm run build

  # 2. Python Backend Logic Validation & Deep ML Suite
  backend_ci:
    name: FastAPI Microservices Unit & Pipeline Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Microservice Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Python Pytest Suite
        run: |
          pytest tests/unit -v
          pytest tests/integration -v

  # 3. Docker Registry Compilation Gates (Smoke Test builds)
  docker_build_ci:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [frontend_ci, backend_ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Verify API Service Docker Build
        run: |
          docker build -t ltr-api-service:test -f Dockerfile .

      - name: Verify Web Frontend Docker Build
        run: |
          docker build -t ltr-web-frontend:test -f Dockerfile.frontend .
