version: "3.9"

# ─────────────────────────────────────────────
# AI Search & Recommendation Platform
# Production-grade docker-compose stack
# Services: API, Redis, Prometheus, Grafana, Elasticsearch
# ─────────────────────────────────────────────

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    labels: "service"

services:
  # ─── Application API ─────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ai-search-platform:latest
    container_name: ai-search-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./production.db
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=production
      - WORKERS=4
      - LOG_LEVEL=info
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./models:/app/models:ro
      - api-logs:/app/logs
      - api-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging
    labels:
      - "service=api"
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=8000"
      - "prometheus.io/path=/api/v1/metrics/prometheus"
    networks:
      - backend
      - monitoring

  # ─── Redis Cache / Feature Store ─────────
  redis:
    image: redis:7-alpine
    container_name: ai-search-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
      --loglevel notice
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    labels:
      - "service=redis"
    networks:
      - backend

  # ─── MLflow Tracking Server ───────────────
  mlflow:
    image: python:3.11-slim
    container_name: ai-search-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      bash -c "pip install mlflow --quiet &&
               mlflow server
               --host 0.0.0.0
               --port 5000
               --default-artifact-root /mlruns/artifacts
               --backend-store-uri sqlite:///mlruns/mlflow.db"
    volumes:
      - mlflow-data:/mlruns
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - monitoring

  # ─── Prometheus Metrics Scraping ─────────
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: ai-search-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    networks:
      - monitoring

  # ─── Grafana Dashboards ───────────────────
  grafana:
    image: grafana/grafana:10.3.0
    container_name: ai-search-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    networks:
      - monitoring

  # ─── Elasticsearch (optional: vector search) ─
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: ai-search-elasticsearch
    restart: unless-stopped
    profiles:
      - elasticsearch  # Only start with: docker-compose --profile elasticsearch up
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    logging: *default-logging
    networks:
      - backend

  # ─── Nginx Reverse Proxy ──────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ai-search-nginx
    restart: unless-stopped
    profiles:
      - nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - backend
      - monitoring

# ─── Volumes ───────────────────────────────
volumes:
  redis-data:
    driver: local
  api-logs:
    driver: local
  api-data:
    driver: local
  mlflow-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  elasticsearch-data:
    driver: local

# ─── Networks ──────────────────────────────
networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
